# Parametros del pipeline waymo_v2
# Directorios de entrada (Waymo Open Dataset v2.0.1, formato Parquet)
# Coloca los archivos .parquet descargados desde Colab en las subcarpetas correspondientes.

lidar_box_dir: data/01_raw/waymo_v2/lidar_box
assoc_dir: data/01_raw/waymo_v2/camera_to_lidar_box_association
stats_dir: data/01_raw/waymo_v2/stats
camera_image_dir: data/01_raw/waymo_v2/camera_image
image_output_dir: data/02_raw/grayscale_images

# PySpark: local[*] usa todos los nucleos disponibles en la maquina local.
# Cambiar a "spark://host:7077" para un cluster real.
spark_master: "local[*]"
