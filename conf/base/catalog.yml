# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

# --- data_inventory pipeline -------------------------------------------------
# Read-only inventory/profiling of data/01_raw.
# See src/operaciones_aeronaves/pipelines/data_inventory.

data_inventory_raw_files_index:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/data_inventory_raw_files_index.parquet

data_inventory_raw_sample_profile:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/data_inventory_raw_sample_profile.parquet

data_inventory_summary:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/data_inventory_summary.parquet

data_inventory_report_md:
  type: text.TextDataset
  filepath: data/08_reporting/data_inventory_report.md
  fs_args:
    open_args_save: { mode: w, encoding: utf-8 }
    open_args_load: { mode: r, encoding: utf-8 }

# --- data_processing pipeline -------------------------------------------------
# Ingesta, limpieza, integracion y EDA basico de datos aeronauticos JAC.
# See src/operaciones_aeronaves/pipelines/data_processing.

vuelos_raw:
  type: pandas.ParquetDataset
  filepath: data/01_raw/bitacora-vuelos.parquet

aeropuertos_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/operaciones-aeropuertos.csv

# 02_intermediate: datos en transformacion
vuelos_preprocessed:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/vuelos_preprocessed.parquet

eda_figura_manifest:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/eda_figura_manifest.parquet

# 03_primary: dato integrado y limpio, listo para modelar
vuelos_con_operaciones:
  type: pandas.ParquetDataset
  filepath: data/03_primary/vuelos_con_operaciones.parquet

# --- ml pipeline --------------------------------------------------------------
# EDA avanzado, clustering no supervisado y clasificacion supervisada.
# See src/operaciones_aeronaves/pipelines/ml.

aeropuertos_perfil:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/aeropuertos_perfil.parquet

eda_avanzado_manifest:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/eda_avanzado_manifest.parquet

cluster_labels:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/cluster_labels.parquet

cluster_metricas:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/cluster_metricas.parquet

metricas_supervisado:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/metricas_supervisado.parquet

metricas_cv_supervisado:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/metricas_cv_supervisado.parquet

# 06_models: objetos de modelo serializados con joblib
modelo_kmeans:
  type: pickle.PickleDataset
  filepath: data/06_models/kmeans.pkl
  backend: joblib

modelo_rf:
  type: pickle.PickleDataset
  filepath: data/06_models/random_forest.pkl
  backend: joblib

# --- retrasos_ml pipeline -----------------------------------------------------
# PoC de riesgo de retraso en SCTE (El Tepual, Puerto Montt), 2020-2026.
# Cruza la bitacora con el clima diario para estimar cuanto pesa el clima.
# See src/operaciones_aeronaves/pipelines/retrasos_ml.

# 01_raw: clima diario de Meteostat, estacion 85799 (Puerto Montt).
# Se regenera con: python scripts/descargar_clima_scte.py
clima_diario_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/clima_diario_scte.csv
  load_args:
    parse_dates: ["fecha"]

# 02_intermediate: recorte de la PoC y sus insumos
vuelos_scte:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/vuelos_scte.parquet

vuelos_scte_target:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/vuelos_scte_target.parquet

clima_scte_features:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/clima_scte_features.parquet

metricas_retrasos:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/metricas_retrasos.parquet

busqueda_hiperparametros:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/busqueda_hiperparametros.parquet

efecto_clima_retraso:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/efecto_clima_retraso.parquet

# 03_primary: vuelos + clima, listo para modelar
vuelos_clima:
  type: pandas.ParquetDataset
  filepath: data/03_primary/vuelos_clima.parquet

# 06_models: modelo + metadatos (features, importancia, predicciones de test)
modelo_retrasos:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_retrasos.pkl
  backend: joblib

# --- retrasos_ml: aprendizaje no supervisado ----------------------------------
# Segmentacion de vuelos (descriptiva) y de dias (por condiciones).

perfil_vuelos:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/perfil_vuelos.parquet

segmentos_vuelos:
  type: pandas.ParquetDataset
  filepath: data/04_feature/segmentos_vuelos.parquet

segmentos_dias:
  type: pandas.ParquetDataset
  filepath: data/04_feature/segmentos_dias.parquet

modelo_segmentacion:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_segmentacion.pkl
  backend: joblib
